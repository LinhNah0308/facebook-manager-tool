<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Quản Lý Tài Khoản & Fanpage Facebook - Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white px-6 py-3 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold">🚀 Web Quản Lý Facebook / Free Version</h1>
        <div class="text-sm">Trạng thái: Hoạt động</div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Menu -->
        <aside class="w-64 bg-white border-r border-gray-200 p-4 flex flex-col space-y-2">
            <button onclick="openModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow transition">+ Thêm Tài Khoản</button>
            <button onclick="checkAllStatus()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow transition">Check Live/Die</button>
            <div class="mt-auto text-xs text-gray-400">Phiên bản Web: 1.0.0</div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 overflow-y-auto">
            <!-- Thống kê nhanh -->
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                    <div class="text-gray-500 text-sm">Tổng số</div>
                    <div id="stat-total" class="text-xl font-bold text-blue-600">0</div>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                    <div class="text-gray-500 text-sm">Live</div>
                    <div id="stat-live" class="text-xl font-bold text-green-600">0</div>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-red-500">
                    <div class="text-gray-500 text-sm">Die</div>
                    <div id="stat-die" class="text-xl font-bold text-red-600">0</div>
                </div>
            </div>

            <!-- Bảng tài khoản -->
            <div class="bg-white rounded shadow overflow-hidden">
                <table class="w-full border-collapse text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="p-3">STT</th>
                            <th class="p-3">UID</th>
                            <th class="p-3">Họ và Tên</th>
                            <th class="p-3 text-center">Số Page</th>
                            <th class="p-3 text-center">Trạng Thái</th>
                            <th class="p-3">Cookie</th>
                        </tr>
                    </thead>
                    <tbody id="account-table-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Thêm Cookie -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-full max-w-lg shadow-xl">
            <h3 class="text-lg font-bold mb-3 text-gray-800">Thêm tài khoản bằng Cookie</h3>
            <p class="text-sm text-gray-500 mb-2">Dán đoạn Cookie Facebook của bạn vào bên dưới:</p>
            <textarea id="cookieInput" rows="5" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs" placeholder="c_user=...; xs=..."></textarea>
            <div class="flex justify-end space-x-2 mt-4">
                <button onclick="closeModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded text-sm">Hủy</button>
                <button onclick="submitCookie()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm">Thêm</button>
            </div>
        </div>
    </div>

    <!-- Modal Xem Danh Sách Page -->
    <div id="pageModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg w-full max-w-xl shadow-xl">
            <h3 id="pageModalTitle" class="text-lg font-bold mb-3 text-gray-800">Danh sách Fanpage</h3>
            <div class="max-h-60 overflow-y-auto border border-gray-200 rounded">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-2">STT</th>
                            <th class="p-2">Tên Page</th>
                            <th class="p-2">ID Page</th>
                        </tr>
                    </thead>
                    <tbody id="page-table-body"></tbody>
                </table>
            </div>
            <div class="flex justify-end mt-4">
                <button onclick="closePageModal()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        let accounts = [];

        function openModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('addModal').classList.add('hidden'); }
        function closePageModal() { document.getElementById('pageModal').classList.add('hidden'); }

        async function submitCookie() {
            const cookie = document.getElementById('cookieInput').value.trim();
            if (!cookie) { alert("Vui lòng nhập cookie!"); return; }
            
            closeModal();
            const response = await fetch('/api/add_account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cookie })
            });
            const result = await response.json();
            
            if (result.success) {
                accounts.push(result.account);
                renderTable();
                alert("Thêm tài khoản thành công!");
            } else {
                alert(result.message);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('account-table-body');
            tbody.innerHTML = '';
            let live = 0, die = 0;

            accounts.forEach((acc, index) => {
                if (acc.status === 'LIVE') live++; else die++;
                tbody.innerHTML += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 cursor-pointer" ondblclick="showPages(${index})">
                        <td class="p-3">${index + 1}</td>
                        <td class="p-3 font-medium text-blue-600">${acc.uid}</td>
                        <td class="p-3">${acc.name}</td>
                        <td class="p-3 text-center"><span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs">${acc.pages.length} Page</span></td>
                        <td class="p-3 text-center"><span class="${acc.status === 'LIVE' ? 'text-green-600 bg-green-100' : 'text-red-600 bg-red-100'} px-2 py-0.5 rounded text-xs font-bold">${acc.status}</span></td>
                        <td class="p-3 truncate max-w-xs text-gray-400">${acc.cookie}</td>
                    </tr>
                `;
            });

            document.getElementById('stat-total').innerText = accounts.length;
            document.getElementById('stat-live').innerText = live;
            document.getElementById('stat-die').innerText = die;
        }

        function showPages(index) {
            const acc = accounts[index];
            document.getElementById('pageModalTitle').innerText = `Danh sách Page của: ${acc.name}`;
            const pBody = document.getElementById('page-table-body');
            pBody.innerHTML = '';
            
            acc.pages.forEach((p, idx) => {
                pBody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2">${idx + 1}</td>
                        <td class="p-2 font-medium">${p.name}</td>
                        <td class="p-2 text-gray-600">${p.id}</td>
                    </tr>
                `;
            });
            document.getElementById('pageModal').classList.remove('hidden');
        }

        async function checkAllStatus() {
            if (accounts.length === 0) { alert("Chưa có tài khoản nào!"); return; }
            for (let acc of accounts) {
                const res = await fetch('/api/check_status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie: acc.cookie })
                });
                const data = await res.json();
                acc.status = data.status;
            }
            renderTable();
            alert("Đã check xong trạng thái!");
        }
    </script>
</body>
</html>
